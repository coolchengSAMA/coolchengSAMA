<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="56" viewBox="0 0 1280 56" aria-hidden="true">
<title>SECTION DIVIDER</title>
<defs><style>
.caret{animation:blink 1.1s steps(1,end) infinite}
.led{animation:blink 1.7s ease-in-out infinite}
.scan{animation:sweep 7.5s linear infinite}
.diamond{animation:pulse 3.4s ease-in-out infinite}
@keyframes blink{0%,46%{opacity:1}50%,100%{opacity:.2}}
@keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(0px)}}
@keyframes pulse{0%,100%{opacity:.95}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.caret,.led,.scan,.diamond{animation:none}}
</style></defs>
<rect x="0" y="28" width="556" height="1" fill="#8A8F98" opacity=".30"/>
<path d="M556 32L564 24H600V32Z" fill="#FFD200"/>
<rect class="diamond" x="618" y="23" width="10" height="10" fill="#FFD200" transform="rotate(45 623 28)"/>
<rect x="640" y="28" width="640" height="1" fill="#8A8F98" opacity=".30"/>
<g fill="#8A8F98" opacity=".55">
<rect x="0" y="25" width="2" height="7"/>
<rect x="1278" y="25" width="2" height="7"/>
</g>
</svg>
