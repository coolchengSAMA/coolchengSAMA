<path d="M878.4 57L898.4 75L878.4 93" fill="none" stroke="#FFD200" stroke-width="4" opacity="0.55"/>
<rect x="321" y="74" width="39" height="1" fill="#242A30"/>
<rect x="920" y="74" width="121" height="1" fill="#242A30"/>
