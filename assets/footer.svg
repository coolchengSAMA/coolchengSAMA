<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="END OF FILE">
<title>END OF FILE</title>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M0 32V0h32" fill="none" stroke="#151A1E" stroke-width="1"/>
</pattern>
<pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="28" height="28" fill="#14171A"/>
<rect width="14" height="28" fill="#FFD200"/>
</pattern>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFD200" stop-opacity="0"/>
<stop offset=".5" stop-color="#FFD200" stop-opacity=".10"/>
<stop offset="1" stop-color="#FFD200" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#FFD200" stop-opacity=".11"/>
<stop offset="1" stop-color="#FFD200" stop-opacity="0"/>
</radialGradient>
<style>
.caret{animation:blink 1.1s steps(1,end) infinite}
.led{animation:blink 1.7s ease-in-out infinite}
.scan{animation:sweep 7.5s linear infinite}
.diamond{animation:pulse 3.4s ease-in-out infinite}
@keyframes blink{0%,46%{opacity:1}50%,100%{opacity:.2}}
@keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(0px)}}
@keyframes pulse{0%,100%{opacity:.95}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.caret,.led,.scan,.diamond{animation:none}}
</style>
</defs>
<rect width="1280" height="150" fill="#0A0C0E"/>
<rect width="1280" height="150" fill="url(#grid)"/>
<rect x="0" y="0" width="1280" height="6" fill="url(#hazard)" opacity=".85"/>
